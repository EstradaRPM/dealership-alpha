name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      # The agent hooks enforce the module-boundary convention at write time.
      # CI proves they still fire — a hook that silently no-ops is worse than none.
      - run: npm run hooks:test
